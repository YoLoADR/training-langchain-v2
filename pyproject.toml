[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hirekit"
version = "2.0.0"
description = "Assistant IA pour recruteurs — Fil rouge formation LangChain (Ambient IT)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yohann Ravino" }]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langsmith>=0.1.0",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["hirekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring API keys or external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"